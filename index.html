<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0a17">
<title>月见塔罗 · 抽一张牌，看看此刻</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div class="stars" id="stars"></div>

<!-- 占卜中 -->
<div class="cast hide" id="cast">
  <div class="wheel">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(216,178,106,.30)" stroke-width="1"/>
      <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(216,178,106,.16)" stroke-width="1" stroke-dasharray="2 7"/>
      <g id="spokes" stroke="rgba(216,178,106,.22)" stroke-width="1"></g>
      <circle cx="100" cy="100" r="58" fill="none" stroke="rgba(216,178,106,.40)" stroke-width="1"/>
      <circle cx="100" cy="100" r="52" fill="none" stroke="rgba(216,178,106,.14)" stroke-width="1" stroke-dasharray="1 6"/>
      <g id="dots" fill="rgba(216,178,106,.65)"></g>
      <circle cx="100" cy="100" r="3" fill="#d8b26a"/>
    </svg>
  </div>
  <div class="cast-t" id="castT">正在洗去杂念</div>
  <div class="bar"><i id="barI"></i></div>
  <div class="cast-p"><span id="castP">0</span>%</div>
  <div class="cast-skip hide" id="skip">轻触跳过</div>
</div>

<!-- 洗牌 -->
<div class="shuf hide" id="shuffle">
  <div class="shuf-box">
    <div class="stack">
      <span class="cz" style="--i:0"></span>
      <span class="cz" style="--i:1"></span>
      <span class="cz" style="--i:2"></span>
      <span class="cz" style="--i:3"></span>
      <span class="cz" style="--i:4"></span>
    </div>
    <div class="shuf-t">洗 牌 中</div>
  </div>
</div>

<!-- 口令 -->
<div class="gate" id="gate">
  <div class="gate-in">
    <div class="eye">☾ ✦ ☽</div>
    <h2>月见塔罗</h2>
    <p class="gtip">请输入购买后获得的口令</p>
    <input id="pw" type="text" autocomplete="off" placeholder="口令" maxlength="12">
    <button class="btn" id="enter">进 入</button>
    <p class="gerr" id="gerr">口令不对，再看看订单消息</p>
  </div>
</div>

<div class="app">

  <!-- 首页 -->
  <section class="screen on" id="s-home">
    <div class="brand">
      <div class="eye">☾ ✦ ☽</div>
      <h1>月见塔罗</h1>
      <div class="sub">TAROT · 七十八张</div>
    </div>

    <div class="ask">
      <label>你想问的（可不填）</label>
      <input id="q" type="text" placeholder="例如：这段关系还值得吗" maxlength="40">
    </div>

    <div class="spreads" id="spreads"></div>

    <button class="btn" id="go">洗 牌</button>
    <div class="foot">牌不会替你做决定<br>它只是把你已经知道的事，说得更清楚一点</div>
  </section>

  <!-- 抽牌 -->
  <section class="screen" id="s-draw">
    <div class="head">
      <div class="t" id="drawTitle">请选择</div>
      <div class="r" id="counter">0 / 3</div>
    </div>
    <div class="hint" id="drawHint">闭上眼睛，在心里把那个问题问一遍。<br>然后凭直觉点选 <b>3</b> 张牌。</div>
    <div class="deck" id="deck"></div>
    <button class="btn" id="reveal" disabled>翻 开</button>
    <button class="btn ghost" id="back1">重来</button>
  </section>

  <!-- 结果 -->
  <section class="screen" id="s-result">
    <div class="head">
      <div class="t">解读</div>
      <div class="r" id="resDate"></div>
    </div>
    <div class="rwrap" id="result"></div>
    <button class="btn" id="again">再抽一次</button>
    <button class="btn ghost" id="share">复制解读文字</button>
  </section>

</div>

<script src="cards.js?v=8"></script>
<script src="app.js?v=8"></script>
</body>
</html>
